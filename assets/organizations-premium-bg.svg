<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" preserveAspectRatio="none">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.48" stop-color="#f8fdfe"/>
    <stop offset="1" stop-color="#eaf8fa"/>
  </linearGradient>
  <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#9be5ef" stop-opacity=".42"/>
    <stop offset=".48" stop-color="#dff8fb" stop-opacity=".72"/>
    <stop offset="1" stop-color="#8ddbe8" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#27b9d2" stop-opacity=".18"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".76"/>
    <stop offset="1" stop-color="#48c9dc" stop-opacity=".16"/>
  </linearGradient>
  <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#c7f1f5" stop-opacity=".72"/>
    <stop offset=".55" stop-color="#ffffff" stop-opacity=".42"/>
    <stop offset="1" stop-color="#b7ebf1" stop-opacity=".62"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1800" height="1000" fill="url(#base)"/>

<!-- soft atmospheric glow -->
<ellipse cx="350" cy="220" rx="480" ry="250" fill="#c8f1f5" opacity=".20" filter="url(#blur)"/>
<ellipse cx="1480" cy="250" rx="520" ry="280" fill="#d8f5f7" opacity=".30" filter="url(#blur)"/>

<!-- large flowing water ribbons -->
<path d="M-80 55 C220 -55 430 -20 650 85 C910 215 1110 235 1330 90 C1510 -20 1660 -5 1880 65 L1880 250 C1600 175 1470 205 1290 310 C1060 445 820 410 590 275 C360 135 180 160 -80 275 Z" fill="url(#waveA)"/>
<path d="M-90 150 C170 30 390 55 610 165 C865 295 1085 330 1305 205 C1515 85 1675 90 1890 165 L1890 350 C1660 275 1505 285 1320 390 C1080 530 825 500 570 350 C350 220 175 235 -90 350 Z" fill="url(#waveB)"/>
<path d="M-80 355 C180 235 380 270 600 385 C835 505 1065 570 1285 445 C1515 315 1690 325 1890 410 L1890 600 C1650 510 1495 525 1280 640 C1045 755 800 715 565 575 C345 445 175 465 -80 570 Z" fill="url(#waveC)"/>

<!-- thin premium wave contours -->
<path d="M-40 115 C210 0 405 20 630 135 C885 265 1080 295 1300 165 C1510 40 1670 50 1850 135" fill="none" stroke="#ffffff" stroke-width="4" opacity=".82"/>
<path d="M-30 485 C205 365 395 390 610 505 C850 635 1060 675 1280 555 C1505 430 1670 440 1840 520" fill="none" stroke="#6bcfdf" stroke-width="3" opacity=".25"/>

<!-- very subtle glass bubbles -->
<g fill="none" stroke="#63cbd9" opacity=".17">
  <circle cx="150" cy="690" r="38" stroke-width="2"/><circle cx="210" cy="745" r="17" stroke-width="1.5"/>
  <circle cx="1580" cy="690" r="50" stroke-width="2"/><circle cx="1650" cy="755" r="20" stroke-width="1.5"/>
  <circle cx="1480" cy="120" r="28" stroke-width="1.5"/>
</g>

<!-- faint institutional architectural silhouette, kept intentionally subtle -->
<g opacity=".045" fill="#0b5470">
  <rect x="1370" y="105" width="300" height="150" rx="8"/>
  <path d="M1330 105 L1518 35 L1710 105 Z"/>
  <rect x="1395" y="140" width="28" height="100"/><rect x="1450" y="140" width="28" height="100"/>
  <rect x="1505" y="140" width="28" height="100"/><rect x="1560" y="140" width="28" height="100"/><rect x="1615" y="140" width="28" height="100"/>
</g>

<!-- tiny fish silhouettes -->
<g fill="#0b91ad" opacity=".10">
 <path d="M170 330 q32 -20 64 0 q-32 20 -64 0 l-18 -18 v36z"/>
 <path d="M290 385 q24 -15 48 0 q-24 15 -48 0 l-14 -14 v28z"/>
 <path d="M1580 380 q34 -22 68 0 q-34 22 -68 0 l-20 -20 v40z"/>
</g>
</svg>
